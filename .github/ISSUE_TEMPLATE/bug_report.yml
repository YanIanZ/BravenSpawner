name: Bug report
description: Something behaves incorrectly
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please include the server log excerpt around the failure. Reports without
        logs for a crash are usually not actionable.
  - type: input
    id: version
    attributes:
      label: BravenSpawner version
      placeholder: 1.0.0
    validations:
      required: true
  - type: input
    id: server
    attributes:
      label: Server software and version
      placeholder: Paper 1.21.1 / Folia 1.21.1
    validations:
      required: true
  - type: input
    id: java
    attributes:
      label: Java version
      placeholder: 'output of java -version'
    validations:
      required: true
  - type: dropdown
    id: storage
    attributes:
      label: Storage backend
      options: [YAML, SQLite, MySQL, not sure]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. /vspawner give ZOMBIE
        2. place the block
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      render: shell
