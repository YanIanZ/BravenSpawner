# ---------------------------------------------------------------------------
# Text formatting (every name, lore line, title, message and hologram line)
#   Legacy codes   &a &l &r ...  (also §a)
#   Hex colours    &#ff8800   {#ff8800}   <#ff8800>   &x&f&f&8&8&0&0
#   MiniMessage    <red> <bold> <color:#ff8800> <gradient:#ff0000:#0000ff>text</gradient> <rainbow>text</rainbow>
#   Unicode        raw UTF-8 (✦ ❤ 🔥) or escapes \u2764 and \U0001F525
#   Literal chars  prefix with a backslash: \< \& \{ \\
#                  (backslash forms need 'single quotes' or no quotes; "double quotes" are YAML escapes)
#   Item names and lore are not italic unless you add &o or <italic>.
# ---------------------------------------------------------------------------
use_item_spawners: true
item_spawner_optimization: false
instant_page_navigation: true
use_new_ticking_system: true
skip-menu: false
bedrock: false
enable-logger: false
restore-missing-spawners: false

chest_gui:
  enabled: true
  protection:
    reconnect_cooldown: 3000
    spawner_lock_timeout: 5000
    max_teleport_distance: 100.0

# Per-player cooldowns in milliseconds. 0 disables one.
#   break: between two spawner breaks   stack: between two shift-right-click merges
cooldowns:
  break: 300
  stack: 150
  gui_open: 1000

blacklisted-worlds: []

no-activation-range: false
activation-radius: 10

block-collection-in-inventory: true
unlimited-storage: false
spawner-limit-in-chunk: 100
convert-spawners: true
full-stack: false
allow-hoppers: false
enable-mending: false
drop-xp-as-orbs: false
placeholders-in-gui: false
remove-durability-on-break: false
silk-touch-only: false
disable-explosion-damage-spawner: true
multiple-drop: false
stack-limit: 200000

enable-boosters: true
disable-autosell-notifications: false
disable-item-stock: false
disable-sell-feature: false

ownership:
  enabled: true

corruption:
  enabled: false
  allow-breaking: false
  solve-radius: 5
  delay:
    min: 3600
    max: 21600

ninja-spawners:
  enable-invisibility: false
  start-invisibility-distance: 128
  refresh-rate: 1
  visibility-distance: 15

spawner-item:
  material: SPAWNER
  name: "&e%displayname%'s Spawner"
  lore:
    - "&7Place to activate."
    - "&7Right-click to open storage."

money-decimals:
  enabled: true
  apply-on-amount: true
  formats:
    "1": "%number%K"
    "2": "%number%M"
    "3": "%number%B"
    "4": "%number%T"
    "5": "%number%Q"
    "6": "%number%Qt"

economy:
  enabled: false
  purchase-price: 2500.0
  sell-multiplier: 1.0
  autosell: false

sell:
  # Seconds between autosell passes; only used when economy.autosell is true.
  # Values below 5 are raised to 5 so a misconfiguration cannot spin the pass.
  autosell-interval-seconds: 60

# Upgrade tiers, cheapest first. The first tier is the base every spawner starts at.
#   cost            money for this tier (negative values are treated as 0)
#   interval-ticks  production delay cap: an upgraded spawner uses the FASTER of the
#                   product's spawn delay and this value, so upgrading never slows it
#                   (minimum 20)
#   capacity        storage size relative to the first tier: maximum-items is
#                   multiplied by capacity / first-tier capacity (never below 1x;
#                   minimum 1)
upgrades:
  tiers:
    - name: base
      cost: 0.0
      interval-ticks: 1200
      capacity: 45
    - name: iron
      cost: 5000.0
      interval-ticks: 900
      capacity: 90
    - name: gold
      cost: 15000.0
      interval-ticks: 600
      capacity: 135
    - name: diamond
      cost: 50000.0
      interval-ticks: 300
      capacity: 180

boosters:
  # Duration granted by /bspawner booster, in seconds. Values outside 5..86400 are
  # clamped when the config is loaded.
  # Booster items are defined in boosters/*.yml and handed out with
  # /bspawner boosteritem; only those tagged items work (plain materials such as
  # SUGAR do nothing). A booster never replaces a stronger active one of the same
  # type; an equal one only extends the deadline.
  duration-seconds: 600

hologram:
  enabled: true
  line: "&e%product% &7| &f%stored% &7stored"

sell-prices:
  ROTTEN_FLESH: 0.5
  BONE: 0.5
  ARROW: 0.2
  BLAZE_ROD: 3.0
  COBBLESTONE: 0.1
  WHEAT: 0.4
  DIAMOND: 25.0

mobs:
  ZOMBIE:
    display: "&2Zombie"
    xp: 5
    drops:
      - "ROTTEN_FLESH:2"
      - "IRON_INGOT:1:0.10"
  SKELETON:
    display: "&7Skeleton"
    xp: 5
    drops:
      - "BONE:2"
      - "ARROW:2"
  BLAZE:
    display: "&6Blaze"
    xp: 10
    drops:
      - "BLAZE_ROD:1"
  IRON_GOLEM:
    display: "&fIron Golem"
    xp: 15
    drops:
      - "IRON_INGOT:3"

items:
  COBBLE:
    display: "&7Cobblestone Generator"
    drops:
      - "COBBLESTONE:3"
  WHEAT:
    display: "&eWheat Farm"
    drops:
      - "WHEAT:3"
      - "SEEDS:1:0.5"
  DIAMOND:
    display: "&bDiamond Vein"
    drops:
      - "DIAMOND:1:0.25"

debug: false
