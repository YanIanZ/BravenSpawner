# ---------------------------------------------------------------------------
# Text formatting (every name, lore line, title, message and hologram line)
#   Legacy codes   &a &l &r ...  (also §a)
#   Hex colours    &#ff8800   {#ff8800}   <#ff8800>   &x&f&f&8&8&0&0
#   MiniMessage    <red> <bold> <color:#ff8800> <gradient:#ff0000:#0000ff>text</gradient> <rainbow>text</rainbow>
#   Unicode        raw UTF-8 (✦ ❤ 🔥) or escapes \u2764 and \U0001F525
#   Literal chars  prefix with a backslash: \< \& \{ \\
#                  (backslash forms need 'single quotes' or no quotes; "double quotes" are YAML escapes)
#   Item names and lore are not italic unless you add &o or <italic>.
# ---------------------------------------------------------------------------
use_item_spawners: true
# Inventory actions run on the player scheduler next tick; stale windows are ignored.
skip-menu: false
bedrock: false
enable-logger: false
restore-missing-spawners: false

chest_gui:
  enabled: true
  protection:
    reconnect_cooldown: 3000
    spawner_lock_timeout: 5000
    max_teleport_distance: 100.0

# Per-player cooldowns in milliseconds. 0 disables one.
#   break: between two spawner breaks   stack: between two shift-right-click merges
cooldowns:
  break: 300
  stack: 150
  gui_open: 1000

blacklisted-worlds: []

no-activation-range: false
activation-radius: 10

block-collection-in-inventory: true
unlimited-storage: false
# Virtual storage limits per spawner; 0 = no gameplay limit. Quantities are exact
# 64-bit counts. The total cap comes from each product's max-stored-items (scaled by
# stack and tier); these add a cap on different item kinds and on one kind's amount.
# A spawner never holds more than 4096 different kinds, the most that can be saved.
storage-limits:
  max-distinct-items: 0
  max-per-item: 0

# SuperiorSkyblock2 integration (used only when SuperiorSkyblock2 is installed).
# Works with SourbyCraft Aurora World Fabric and AdvancedSlimePaper island worlds, and with
# Aurora MultiProfile (membership follows the active profile when SSB2 has profile support).
superiorskyblock:
  enabled: true
  # Island privileges gate using, placing and breaking spawners on an island.
  island-permissions: true
  # Members holding the "use" privilege may use every spawner of their island,
  # not only the ones they placed. Breaking stays with the spawner's owner.
  members-share-spawners: true
  # Apply the island's spawner-rates (speed) and mob-drops (loot) upgrade multipliers.
  multipliers: true
  max-multiplier: 100.0
  # Remove the spawner records of a disbanded island (its blocks or worlds are gone).
  remove-spawners-on-disband: true
  # Autosell pays an owner only while they are a member of the spawner's island
  # (with Aurora MultiProfile: while that island's profile is active).
  autosell-requires-membership: true
  # World-name prefixes of island worlds. If SSB2 is installed but fails, spawner
  # actions are denied only in these worlds. Defaults: SSB2's own world and
  # SSB-AuroraWorlds (AWF) island worlds.
  island-worlds: [SuperiorWorld, ssb_]
  # SSB2 privilege names. Names starting with BRAVENSPAWNER_ are registered as new
  # island privileges (then grant them per role in SSB2's permission menu).
  privileges:
    use: CHEST_ACCESS
    place: BUILD
    break: SPAWNER_BREAK
# Maximum spawners per chunk (0 = no limit). By default this counts spawner BLOCKS,
# so stacking onto an existing spawner is never refused by it. Set
# spawner-limit-in-chunk-mode: stacks to count stack units instead (then a chunk
# holds at most this many units in total, across all its spawners).
spawner-limit-in-chunk: 100
spawner-limit-in-chunk-mode: blocks
convert-spawners: true
allow-hoppers: false
enable-mending: false
drop-xp-as-orbs: false
placeholders-in-gui: false
remove-durability-on-break: false
silk-touch-only: false
disable-explosion-damage-spawner: true
stack-limit: 200000

enable-boosters: true
disable-autosell-notifications: false
disable-sell-feature: false

# false: spawners are not private; anyone may open, stack onto or break them
# (protection plugins and bravenspawner.admin still apply).
ownership:
  enabled: true

corruption:
  enabled: false
  allow-breaking: false
  solve-radius: 5
  delay:
    min: 3600
    max: 21600

ninja-spawners:
  enable-invisibility: false
  start-invisibility-distance: 128
  refresh-rate: 1
  visibility-distance: 15

# Particles shown around placed spawners. Only players within view-distance
# blocks see them, and they run on the spawner's own region (Folia-safe).
#   type          Bukkit particle name (DUST, HAPPY_VILLAGER, FLAME, ENCHANT, ...).
#                 Old names such as REDSTONE or VILLAGER_HAPPY are accepted. An
#                 unknown name disables that effect with one console warning.
#   count         particles per show (1..200)
#   offset        random spread around the block centre, in blocks (0..4)
#   speed         particle speed / extra value (0..4)
#   view-distance blocks (1..128)
#   color         "#RRGGBB" or a name (RED, GOLD, ...); only used by particles
#                 that take a colour (DUST, DUST_COLOR_TRANSITION, ENTITY_EFFECT)
#   size          dust size (0.1..4), DUST only
particles:
  # Master switch for every effect below.
  enabled: true
  # Every production cycle of an active spawner.
  spawner:
    enabled: true
    type: HAPPY_VILLAGER
    count: 6
    offset: 0.35
    speed: 0.0
    view-distance: 16
    color: "#7EE787"
    size: 1.0
  # A spawner item merged into a placed spawner.
  stack:
    enabled: true
    type: TOTEM_OF_UNDYING
    count: 20
    offset: 0.4
    speed: 0.15
    view-distance: 16
  # A tier upgrade bought in the spawner menu.
  upgrade:
    enabled: true
    type: ENCHANT
    count: 40
    offset: 0.5
    speed: 0.6
    view-distance: 16
  # A booster activated on a spawner.
  booster:
    enabled: true
    type: DUST
    count: 24
    offset: 0.45
    speed: 0.0
    view-distance: 16
    color: "#4D96FF"
    size: 1.2

spawner-item:
  material: SPAWNER
  name: "&e%displayname%'s Spawner"
  lore:
    - "&7Place to activate."
    - "&7Right-click to open storage."

money-decimals:
  enabled: true
  apply-on-amount: true
  formats:
    "1": "%number%K"
    "2": "%number%M"
    "3": "%number%B"
    "4": "%number%T"
    "5": "%number%Q"
    "6": "%number%Qt"

economy:
  enabled: false
  purchase-price: 2500.0
  sell-multiplier: 1.0
  # Online owners are quoted/paid on their entity scheduler.
  # Folia: offline owners keep stock until online; Paper retains offline-capable payouts.
  autosell: false
  # Decimal places sale payouts are rounded to (HALF_UP). 0..6, default 2.
  # Whole-unit currencies (points, levels, items) then round payouts DOWN and
  # prices UP, so a price is never discounted to zero.
  round-to: 2
  # Which currency each action uses. economy.enabled is the master switch for all.
  #   VAULT              any Vault economy (default)
  #   PLAYERPOINTS       PlayerPoints plugin (whole points)
  #   coinsengine:<id>   a CoinsEngine / ExcellentEconomy currency, e.g. coinsengine:gems
  #   EXP_LEVELS         player levels (online players only)
  #   EXP_POINTS         raw experience points (online players only)
  #   ITEM               physical items, see item-currency below (online players only)
  # Unset keys fall back to hooks.yml "currency", then VAULT. An unavailable or
  # unknown currency refuses the action with a message — it is never free.
  # Autosell skips offline owners when sell uses an online-only currency.
  currencies:
    sell: VAULT
    buy-stack: VAULT
    upgrade: VAULT
    spawner-buy: VAULT
  # How amounts are written: symbol + number + suffix. The number uses
  # money-decimals compaction (1.50K ...) from 1000 up when compact is true.
  # decimals: -1 keeps the classic money-decimals output. "name" sets %currency%.
  format:
    VAULT:
      symbol: ""
      suffix: ""
      decimals: -1
    PLAYERPOINTS:
      suffix: " points"
      decimals: 0
    EXP_LEVELS:
      suffix: " levels"
      decimals: 0
    EXP_POINTS:
      suffix: " XP"
      decimals: 0
    # "coinsengine:gems":
    #   symbol: "♦"
    #   decimals: 0
  # The ITEM currency: what counts as one unit. Empty name / custom-model-data 0
  # accept any item of that material.
  item-currency:
    material: EMERALD
    name: ""
    custom-model-data: 0

sell:
  # Seconds between autosell passes (global autosell or an active autosell booster).
  # Values below 5 are raised to 5 so a misconfiguration cannot spin the pass.
  autosell-interval-seconds: 60

# Upgrade tiers, cheapest first. The first tier is the base every spawner starts at.
#   cost            money for this tier (negative values are treated as 0)
#   speed           production speed multiplier. Every product has its own delay
#                   (spawn-delays in mobs/*.yml and itemspawners/*.yml); a tier divides
#                   that delay by this value, so 2.0 produces twice as often. Never
#                   below the first tier's speed; 0.1..20.
#   interval-ticks  used only when a tier has no speed: its speed is then
#                   first-tier interval / this interval (1200 / 900 = 1.33x). The first
#                   tier's value is also the delay of a product that declares none.
#   capacity        storage size relative to the first tier: maximum-items is
#                   multiplied by capacity / first-tier capacity (never below 1x;
#                   minimum 1)
upgrades:
  tiers:
    - name: base
      cost: 0.0
      speed: 1.0
      interval-ticks: 1200
      capacity: 45
    - name: iron
      cost: 5000.0
      speed: 1.33
      capacity: 90
    - name: gold
      cost: 15000.0
      speed: 2.0
      capacity: 135
    - name: diamond
      cost: 50000.0
      speed: 4.0
      capacity: 180

boosters:
  # Duration granted by /bspawner booster, in seconds. Values outside 5..86400 are
  # clamped when the config is loaded.
  # Booster items are defined in boosters/*.yml and handed out with
  # /bspawner boosteritem; only those tagged items work (plain materials such as
  # SUGAR do nothing). A booster never replaces a stronger active one of the same
  # type; an equal one only extends the deadline.
  duration-seconds: 600

sell-prices:
  ROTTEN_FLESH: 0.5
  BONE: 0.5
  ARROW: 0.2
  BLAZE_ROD: 3.0
  COBBLESTONE: 0.1
  WHEAT: 0.4
  DIAMOND: 25.0

mobs:
  ZOMBIE:
    display: "&2Zombie"
    xp: 5
    drops:
      - "ROTTEN_FLESH:2"
      - "IRON_INGOT:1:0.10"
  SKELETON:
    display: "&7Skeleton"
    xp: 5
    drops:
      - "BONE:2"
      - "ARROW:2"
  BLAZE:
    display: "&6Blaze"
    xp: 10
    drops:
      - "BLAZE_ROD:1"
  IRON_GOLEM:
    display: "&fIron Golem"
    xp: 15
    drops:
      - "IRON_INGOT:3"

items:
  COBBLE:
    display: "&7Cobblestone Generator"
    drops:
      - "COBBLESTONE:3"
  WHEAT:
    display: "&eWheat Farm"
    drops:
      - "WHEAT:3"
      - "SEEDS:1:0.5"
  DIAMOND:
    display: "&bDiamond Vein"
    drops:
      - "DIAMOND:1:0.25"

# Extra diagnostics in the console, prefixed with [debug].
debug: false
