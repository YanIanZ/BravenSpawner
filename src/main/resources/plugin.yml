name: BravenSpawner
version: '${version}'
main: dev.yanianz.bravenspawner.BravenSpawner
api-version: '1.20'
author: yanianz
description: Virtual spawners with stacking, chest GUI, upgrades, boosters, corruption and Folia support.
load: POSTWORLD
folia-supported: true
softdepend:
  - Vault
  - WorldGuard
  - Lands
  - Towny
  - PlaceholderAPI
commands:
  bspawner:
    description: Manage BravenSpawner
    aliases: [bravenspawner, vs, bs]
    permission: bravenspawner.admin
  bmodify:
    description: Toggle trust on a spawner
    aliases: [bsmodify]
    permission: bravenspawner.use
  bhtoggle:
    description: Toggle holograms on your spawners
    aliases: [bstoggle]
    permission: bravenspawner.use
permissions:
  bravenspawner.admin:
    default: op
  bravenspawner.use:
    default: true
  bravenspawner.item.extract:
    default: true
