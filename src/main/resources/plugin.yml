name: BravenSpawner
version: '${version}'
main: dev.yanianz.bravenspawner.BravenSpawner
api-version: '1.21'
author: yanianz
description: Virtual spawners with stacking, chest GUI, upgrades, boosters, corruption and Folia support.
load: POSTWORLD
folia-supported: true
softdepend:
  - sourbyapi
  - SourbyCraft
  - Essentials
  - EssentialsX
  - ShopGUIPlus
  - EconomyShopGUI
  - EconomyShopGUI-Premium
  - WorldEdit
  - Vault
  - PlayerPoints
  - CoinsEngine
  - ExcellentEconomy
  - zShop
  - ExcellentShop
  - Nascraft
  - DonutWorth
  - WorldGuard
  - SuperiorSkyblock2
  - Lands
  - Towny
  - PlaceholderAPI
  - floodgate
  - Geyser-Spigot
commands:
  bspawner:
    description: Manage BravenSpawner
    aliases: [bravenspawner, vspawner, virtualspawner, vs, bs]
    permission: bravenspawner.admin
  bmodify:
    description: Toggle trust on a spawner
    aliases: [bsmodify, vmodify]
    permission: bravenspawner.use
  bhtoggle:
    description: Toggle holograms on your spawners
    aliases: [bstoggle, shtoggle]
    permission: bravenspawner.use
permissions:
  bravenspawner.admin:
    default: op
  bravenspawner.use:
    default: true
  bravenspawner.item.extract:
    default: true
  bravenspawner.action.*:
    # Grant explicitly to give every action node. Not a default: with default true its
    # children would override a single node set to false in permissions.yml.
    description: Every per-action spawner menu node. Each narrows access; none grants it.
    default: false
    children:
      bravenspawner.action.sell: true
      bravenspawner.action.xp: true
      bravenspawner.action.upgrade: true
      bravenspawner.action.buy: true
  bravenspawner.action.sell:
    description: Sell spawner storage from the menu (sell all, right-click sell, collect all).
    default: true
  bravenspawner.action.xp:
    description: Collect stored spawner XP from the menu.
    default: true
  bravenspawner.action.upgrade:
    description: Buy the next spawner tier from the menu.
    default: true
  bravenspawner.action.buy:
    description: Open the buy-stack menu and buy spawner stack units.
    default: true

  bravenspawner.restrictions.bypass:
    default: op
