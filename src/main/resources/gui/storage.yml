# ================================
#   BravenSpawner: Storage Menu
# ================================
# Notes:
# - The first five rows show stored items: every filler ('-') slot above the
#   bottom row is a storage cell. The bottom row holds the controls.
# - Placeholders: %entity% %displayname% %page% %pages% %storage_value% %storage_price%
# - nbt actions: previous, next, takeall, sellall, goback, takeone, takestack,
#   dropall, xp, information.
# ================================

menu:
  title: "&#F7B733✦ &8%displayname% &7» &8Storage &7(%page%/%pages%)"
  rows: 6

  layout:
    default:
      - "---------"
      - "---------"
      - "---------"
      - "---------"
      - "---------"
      - "p--agw--n"  # p: previous, a: take all, g: go back, w: sell all, n: next
    # Bedrock players: pick "take one" or "take a stack", then tap items
    bedrock_mode:
      - "---------"
      - "---------"
      - "---------"
      - "---------"
      - "---------"
      - "p-osgaw-n"  # o: take one, s: take stack

  # Appended to the name of the selected take mode (bedrock).
  selected_text: "&7 (&#7EE787selected&7)"

  # Adds the hint lines below to every stored item.
  enable_informative_lore: true

  # Pages shown at most; items beyond them can still be taken with Take All.
  max_page_amount: 10

  informative_lore:
    - ""
    - "&#F7B733» &7Left-click: &ftake 1"
    - "&#F7B733» &7Right-click: &ftake 64"
    - "&#F7B733» &7Shift-click: &ftake a stack"

items:
  # Empty storage cells and bottom-row padding.
  filler:
    material: BLACK_STAINED_GLASS_PANE
    name: " "
    lore: []
    custom-model: -1
    symbol: '-'

  take_all:
    material: CHEST_MINECART
    name: "&#4D96FF&lTake All"
    lore:
      - "&7Moves everything that fits"
      - "&7into your inventory."
      - ""
      - "&#F7B733» &7Click: &ftake all"
    custom-model: -1
    symbol: 'a'
    nbt: "takeall"

  sell_all:
    material: GOLD_BLOCK
    name: "&#F7B733&lSell All"
    lore:
      - "&7Worth: &f%storage_price%$"
      - ""
      - "&#F7B733» &7Click twice: &fsell everything"
    custom-model: -1
    symbol: 'w'
    nbt: "sellall"

  next:
    material: PLAYER_HEAD
    name: "&#F7B733&lNext Page &7(%page%/%pages%)"
    lore:
      - "&#F7B733» &7Click: &fnext page"
    custom-model: -1
    head-texture: "https://textures.minecraft.net/texture/51e94e1130201af1a3062f62d42ecbb55d59e4cabb3435a0e0062bc008cb0985"
    symbol: 'n'
    nbt: "next"

  previous:
    material: PLAYER_HEAD
    name: "&#F7B733&lPrevious Page &7(%page%/%pages%)"
    lore:
      - "&#F7B733» &7Click: &fprevious page"
    custom-model: -1
    head-texture: "https://textures.minecraft.net/texture/98b1b4819fda0f0babbcd36c8404f34862b529409ea55775712c0b67945977ea"
    symbol: 'p'
    nbt: "previous"

  go_back:
    material: SPECTRAL_ARROW
    name: "&#C9D1D9&lBack"
    lore:
      - "&#F7B733» &7Click: &freturn to the spawner"
    custom-model: -1
    symbol: 'g'
    nbt: "goback"

  take_one:
    material: GOLD_INGOT
    name: "&#FFD93D&lTake &8(&7x1&8)"
    lore:
      - "&7Tapping an item takes one."
    custom-model: -1
    head-texture: ""
    symbol: 'o'
    nbt: "takeone"

  take_stack:
    material: DIAMOND
    name: "&#4D96FF&lTake &8(&7x64&8)"
    lore:
      - "&7Tapping an item takes 64."
    custom-model: -1
    symbol: 's'
    nbt: "takestack"

  # Not placed by default: add 'd' to the bottom row to use it.
  drop_all:
    material: DISPENSER
    name: "&#FF9F45&lDrop Page"
    lore:
      - "&7Drops one stack of every item"
      - "&7on this page at your feet."
    custom-model: -1
    symbol: "d"
    nbt: "dropall"

  spawner_info:
    material: PLAYER_HEAD
    name: "%color%&l%displayname% Spawner"
    lore:
      - "&7Speed: &fevery %speed%s"
      - "&7Items: &f%drop_info% &7per spawn"
      - "&7XP: &f%xp_info% &7per spawn"
      - "&7Stack: &f%stack%&7/&f%max_stack%"
    custom-model: -1
    head-texture: "spawnerhead"
    symbol: 'i'
    nbt: "information"

  xp_collect:
    material: PLAYER_HEAD
    name: "&#FFD93D&lCollect XP"
    lore:
      - "&7Stored: &f%xp_value%"
      - ""
      - "&#F7B733» &7Click: &fcollect XP"
    custom-model: -1
    head-texture: "http://textures.minecraft.net/texture/399ad7a0431692994b6c412c7eafb9e0fc49975240b73a27d24ed797035fb894"
    symbol: 'x'
    nbt: "xp"
