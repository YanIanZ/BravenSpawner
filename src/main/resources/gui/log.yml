# ================================
#   BravenSpawner: History Menu
# ================================
# Shows recent actions on one spawner to its owner and to admins.
# Every filler ('-') slot above the bottom row shows one event; the event's
# name, lore and time format are in messages.yml under "log".
# Placeholders: %displayname% %page% %pages% %player% %logtype% %limit% %time%
# Click a filter to cycle it.
# ================================

menu:
  title: "&#F7B733✦ &8%displayname% &7» &8History"
  rows: 6
  layout:
    - "---------"
    - "---------"
    - "---------"
    - "---------"
    - "---------"
    - "p-gqtsl-n"  # p/n: pages, g: back, q: type, t: player, s: time, l: limit

items:
  filler:
    material: BLACK_STAINED_GLASS_PANE
    name: " "
    lore: []
    custom-model: -1
    symbol: '-'

  next:
    material: PLAYER_HEAD
    name: "&#F7B733&lNext Page &7(%page%/%pages%)"
    lore:
      - "&#F7B733» &7Click: &fnext page"
    custom-model: -1
    head-texture: "https://textures.minecraft.net/texture/51e94e1130201af1a3062f62d42ecbb55d59e4cabb3435a0e0062bc008cb0985"
    symbol: 'n'
    nbt: "next"

  previous:
    material: PLAYER_HEAD
    name: "&#F7B733&lPrevious Page &7(%page%/%pages%)"
    lore:
      - "&#F7B733» &7Click: &fprevious page"
    custom-model: -1
    head-texture: "https://textures.minecraft.net/texture/98b1b4819fda0f0babbcd36c8404f34862b529409ea55775712c0b67945977ea"
    symbol: 'p'
    nbt: "previous"

  go_back:
    material: SPECTRAL_ARROW
    name: "&#C9D1D9&lBack"
    lore:
      - "&#F7B733» &7Click: &freturn to the spawner"
    custom-model: -1
    symbol: 'g'
    nbt: "goback"

  target:
    material: PLAYER_HEAD
    name: "&#C9D1D9&lPlayer: &f%player%"
    lore:
      - "&#F7B733» &7Click: &fonly mine / everyone"
    custom-model: -1
    symbol: 't'
    nbt: "target"

  logtype:
    material: REDSTONE
    name: "&#C9D1D9&lType: &f%logtype%"
    lore:
      - "&#F7B733» &7Click: &fnext type"
    custom-model: -1
    symbol: 'q'
    nbt: "logtype"

  limit:
    material: REPEATER
    name: "&#C9D1D9&lShow: &f%limit% &7events"
    lore:
      - "&#F7B733» &7Click: &f16 / 32 / 64"
    custom-model: -1
    symbol: 'l'
    nbt: "limit"

  time:
    material: CLOCK
    name: "&#C9D1D9&lPeriod: &f%time%"
    lore:
      - "&#F7B733» &7Click: &fall time / hour / day"
    custom-model: -1
    symbol: 's'
    nbt: "time"
