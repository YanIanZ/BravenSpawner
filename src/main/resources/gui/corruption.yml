# ================================
#   BravenSpawner: Uncorrupt Spawner
# ================================
# This menu has no layout: the caller places puzzle panes in puzzle_slots and
# looks the two pane styles up by id (correct / incorrect).
# %entity% and %tier% come from the caller.
menu:
  title: "&5&lUncorrupt Spawner"
  size: 54
  puzzle_slots: [0, 9, 18, 27, 36, 45, 46, 47, 38, 29, 20, 11, 2, 3, 4, 13, 22, 31, 40, 49, 50, 51, 42, 33, 24, 15, 6, 7, 8]

items:
  filler:
    material: BLACK_STAINED_GLASS_PANE
    name: "&8"
    lore: []
    custom-model: -1
    symbol: '-'

  correct:
    material: GREEN_STAINED_GLASS_PANE
    name: "&aCorrect!"
    lore:
      - "&7You've clicked the correct pane!"
    custom-model: -1
    symbol: 'g'

  incorrect:
    material: RED_STAINED_GLASS_PANE
    name: "&cClick me!"
    lore:
      - "&7Click the panes in the correct order"
    custom-model: -1
    symbol: 'r'

sounds:
  correct: UI_BUTTON_CLICK
  incorrect: ENTITY_VILLAGER_NO
  completion: ENTITY_PLAYER_LEVELUP

messages:
  completion: "&aYou successfully uncorrupted the spawner!"
  reset: "&cIncorrect! The puzzle has been reset."
