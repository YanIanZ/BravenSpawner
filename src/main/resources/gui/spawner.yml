# ================================
#   BravenSpawner: Spawner Menu
# ================================
# Notes:
# - Colours: &a codes, hex (&#RRGGBB) and MiniMessage tags all work.
# - Placeholders: %entity% %displayname% %color% %stack% %max_stack% %tier% %speed%
#   %drop_info% %xp_info% %storage_value% %storage_price% %xp_value% %spawner_price%
# - nbt is the button's action: storage, xp, collect_all, sellall/bedrock, boosters,
#   information, buystack, log, upgrade, trusted, close.
# - Selling buttons ask for a second click within 3 seconds.
# ================================

menu:
  title: "&#F7B733✦ &8%displayname% Spawner"
  rows: 3

  layout:
    # Java players
    default:
      - "---------"
      - "--i-s-x--"
      - "--k-u-l--"  # k: buy stacks, u: boosters, l: history

    # Bedrock players (Floodgate), who cannot right-click to sell
    bedrock_mode:
      - "----u----"
      - "--i-s-x--"
      - "--k-b-l--"  # b: sell all

  special:
    # One lore line per active booster, appended to the boosters button.
    # %booster_name%: booster type, %booster_multiplier%: boost, %remaining_time%: time left
    booster_display: "&#F7B733• &f%booster_name% &7%booster_multiplier% &8(%remaining_time%)"

    # Right-clicking the storage button sells everything (after confirming).
    allow_sell_with_storage: true

items:
  filler:
    material: BLACK_STAINED_GLASS_PANE
    name: " "
    lore: []
    custom-model: -1
    symbol: '-'
    nbt: ""

  sell_all:
    material: GOLD_INGOT
    name: "&#F7B733&lSell All"
    lore:
      - "&7Worth: &f%storage_price%$"
      - ""
      - "&#F7B733» &7Click twice: &fsell everything"
    custom-model: -1
    symbol: 'b'
    nbt: "bedrock"

  boosters:
    material: FIREWORK_ROCKET
    name: "&#4D96FF&lBoosters"
    lore:
      - "&7Use a booster item on the"
      - "&7spawner to activate it."
      - ""
      - "&7Active:"
    custom-model: -1
    symbol: 'u'
    nbt: "boosters"

  spawner_info:
    material: PLAYER_HEAD
    name: "%color%&l%displayname% Spawner"
    lore:
      - "&7Speed: &fevery %speed%s"
      - "&7Items: &f%drop_info% &7per spawn"
      - "&7XP: &f%xp_info% &7per spawn"
      - "&7Stack: &f%stack%&7/&f%max_stack%"
      - ""
      - "&#F7B733» &7Click: &fbuy more stacks"
    custom-model: -1
    head-texture: "spawnerhead"
    symbol: 'i'
    nbt: "information"

  storage:
    material: PLAYER_HEAD
    name: "&#7EE787&lStorage"
    lore:
      - "&7Items: &f%storage_value%"
      - "&7Worth: &f%storage_price%$"
      - ""
      - "&#F7B733» &7Left-click: &fopen storage"
      - "&#F7B733» &7Right-click: &fsell everything &8(click twice)"
    custom-model: -1
    head-texture: "http://textures.minecraft.net/texture/68bdc7a1d6cff76a9255652d3165532285acc3a9d1c0f12f39ca007769a7ea14"
    symbol: 's'
    nbt: "storage"

  xp_collect:
    material: PLAYER_HEAD
    name: "&#FFD93D&lCollect XP"
    lore:
      - "&7Stored: &f%xp_value%"
      - ""
      - "&#F7B733» &7Click: &fcollect XP"
    custom-model: -1
    head-texture: "http://textures.minecraft.net/texture/399ad7a0431692994b6c412c7eafb9e0fc49975240b73a27d24ed797035fb894"
    symbol: 'x'
    nbt: "xp"

  # Not placed by default: add 'c' to a layout to use it.
  collect_all:
    material: PLAYER_HEAD
    name: "&#7EE787&lCollect All"
    lore:
      - "&7Money: &f%storage_price%$"
      - "&7XP: &f%xp_value%"
      - ""
      - "&#F7B733» &7Click twice: &fsell items and collect XP"
    custom-model: -1
    head-texture: "http://textures.minecraft.net/texture/67f8d8c39f9921a64d7b755de322e441fded4b775a7657e0b3196b6fda863646"
    symbol: 'c'
    nbt: "collect_all"

  buy_stack:
    material: EMERALD
    name: "&#7EE787&lBuy Stacks"
    lore:
      - "&7Price each: &f%spawner_price%$"
      - "&7Stack: &f%stack%&7/&f%max_stack%"
      - ""
      - "&#F7B733» &7Click: &fopen the shop"
    custom-model: -1
    symbol: 'k'
    nbt: "buystack"

  log:
    material: WRITABLE_BOOK
    name: "&#C9D1D9&lHistory"
    lore:
      - "&7Who used this spawner, and when."
      - "&8Owner and admins only."
      - ""
      - "&#F7B733» &7Click: &fview history"
    custom-model: -1
    symbol: 'l'
    nbt: "log"
