# ================================
#   BravenSpawner: Buy Stacks Menu
# ================================
# Placeholders: %displayname% %price% %total_price% %stack% %max_stack%
# nbt actions: buy_1, buy_64, buy_max (asks for a second click), goback.
# ================================

menu:
  title: "&#F7B733✦ &8%displayname% &7» &8Buy Stacks"
  rows: 3
  layout:
    - "---------"
    - "-1-5-a-g-"
    - "---------"

items:
  filler:
    material: BLACK_STAINED_GLASS_PANE
    name: " "
    lore: []
    custom-model: -1
    symbol: '-'
    nbt: ""

  buy_1:
    material: LIME_STAINED_GLASS_PANE
    name: "&#7EE787&lBuy 1"
    lore:
      - "&7Price: &f%price%$"
      - "&7Stack: &f%stack%&7/&f%max_stack%"
      - ""
      - "&#F7B733» &7Click: &fbuy 1"
    custom-model: -1
    symbol: '1'
    nbt: "buy_1"

  buy_64:
    material: EMERALD
    name: "&#7EE787&lBuy 64"
    lore:
      - "&7Price: &f%total_price%$"
      - "&7Stack: &f%stack%&7/&f%max_stack%"
      - ""
      - "&#F7B733» &7Click: &fbuy up to 64"
    custom-model: -1
    symbol: '5'
    nbt: "buy_64"

  buy_max:
    material: EMERALD_BLOCK
    name: "&#7EE787&lBuy Max"
    lore:
      - "&7Price each: &f%price%$"
      - "&7Stack: &f%stack%&7/&f%max_stack%"
      - ""
      - "&#F7B733» &7Click twice: &fbuy as many as you can afford"
    custom-model: -1
    symbol: 'a'
    nbt: "buy_max"

  go_back:
    material: SPECTRAL_ARROW
    name: "&#C9D1D9&lBack"
    lore:
      - "&#F7B733» &7Click: &freturn to the spawner"
    custom-model: -1
    symbol: 'g'
    nbt: "goback"
