# One product per file. The file name is the product id stored on placed spawners.
entity-type: PIGLIN
display-name: "&6Piglin"

head:
  material: PIGLIN_HEAD
  head-texture: ""
  lore:
    - "&aA spawner for piglins."

# Production delay in seconds, picked between min and max each cycle.
# Upgrade tiers multiply this speed; boosters speed it up further.
spawn-delays:
  min: 40
  max: 60
xp: 8

drops:
  1:
    material: GOLD_INGOT
    amount:
      min: 1
      max: 2
    chance: 80.0
  2:
    material: GOLD_NUGGET
    amount:
      min: 2
      max: 6
    chance: 50.0

stock:
  enabled: true
  max-stock: 1000
  restock-per-cycle: 6

spawner-price: 40000
