# One product per file. The file name is the product id stored on placed spawners.
entity-type: OCELOT
display-name: "&#E8C85AOcelot"

head:
  material: PLAYER_HEAD
  head-texture: https://textures.minecraft.net/texture/9175cc43ea8ae20168a1f170810b4da4d9b4ebd3c9976e9fc22e9f995c3cbc3c
  lore:
    - "&aA spawner for ocelots."

# Production delay in seconds, picked between min and max each cycle.
# Upgrade tiers multiply this speed; boosters speed it up further.
spawn-delays:
  min: 18
  max: 30
xp: 5

# Drops follow the vanilla loot table (empty loot table; fish instead).
drops:
  1:
    material: COD
    amount:
      min: 1
      max: 1
    chance: 30.0
    sell-price: 0.5

stock:
  enabled: true
  max-stock: 1000
  restock-per-cycle: 8

spawner-price: 5000
