    sell-price: 1.5
  2:
    material: PRISMARINE_CRYSTALS
    amount:
      min: 1
      max: 1
    chance: 33.0
    sell-price: 2.5
  3:
    material: COD
    amount:
      min: 1
      max: 1
    chance: 33.0
    sell-price: 0.5
  4:
    material: WET_SPONGE
    amount:
      min: 1
      max: 1
    chance: 50.0
    sell-price: 5.0
  5:
    material: TIDE_ARMOR_TRIM_SMITHING_TEMPLATE
    amount:
      min: 1
      max: 1
    chance: 20.0
    sell-price: 25.0

stock:
  enabled: true
  max-stock: 1000
  restock-per-cycle: 8

spawner-price: 150000
