# One product per file. The file name is the product id stored on placed spawners.
entity-type: ZOGLIN
display-name: "&#C77D8AZoglin"

head:
  material: PLAYER_HEAD
  head-texture: https://textures.minecraft.net/texture/764cfc61ac5295338dd2f4fe67fab628cefd949269923f19a0c77164f8f034bf
  lore:
    - "&aA spawner for zoglins."

# Production delay in seconds, picked between min and max each cycle.
# Upgrade tiers multiply this speed; boosters speed it up further.
spawn-delays:
  min: 25
  max: 40
xp: 5

# Drops follow the vanilla loot table; chance is a percentage.
drops:
  1:
    material: ROTTEN_FLESH
    amount:
      min: 1
      max: 3
    chance: 100.0
    sell-price: 0.3

stock:
  enabled: true
  max-stock: 1000
  restock-per-cycle: 8

spawner-price: 30000
