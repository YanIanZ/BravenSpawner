# One product per file. The file name is the product id stored on placed spawners.
entity-type: STRAY
display-name: "&#9EB6BCStray"

head:
  material: PLAYER_HEAD
  head-texture: https://textures.minecraft.net/texture/592b5597085e35db53d9bda008cae72b2f00cd7d4cd8dc69ff174a55b689e6e
  lore:
    - "&aA spawner for strays."

# Production delay in seconds, picked between min and max each cycle.
# Upgrade tiers multiply this speed; boosters speed it up further.
spawn-delays:
  min: 20
  max: 35
xp: 5

# Drops follow the vanilla loot table; chance is a percentage.
drops:
  1:
    material: ARROW
    amount:
      min: 1
      max: 2
    chance: 67.0
    sell-price: 0.2
  2:
    material: BONE
    amount:
      min: 1
      max: 2
    chance: 67.0
    sell-price: 0.5
  3:
    material: TIPPED_ARROW
    amount:
      min: 1
      max: 1
    chance: 25.0
    sell-price: 0.5

stock:
  enabled: true
  max-stock: 1000
  restock-per-cycle: 8

spawner-price: 15000
