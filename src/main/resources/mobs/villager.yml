# One product per file. The file name is the product id stored on placed spawners.
entity-type: VILLAGER
display-name: "&#B5835AVillager"

head:
  material: PLAYER_HEAD
  head-texture: https://textures.minecraft.net/texture/ea0e3d41e6ebe539e0eb48a67f2ec5da224d408b99ced924f9d0a815e35c57a2
  lore:
    - "&aA spawner for villagers."

# Production delay in seconds, picked between min and max each cycle.
# Upgrade tiers multiply this speed; boosters speed it up further.
spawn-delays:
  min: 50
  max: 80
xp: 5

# Drops follow the vanilla loot table (empty loot table; trade goods instead).
drops:
  1:
    material: EMERALD
    amount:
      min: 1
      max: 1
    chance: 20.0
    sell-price: 3.0
  2:
    material: WHEAT
    amount:
      min: 1
      max: 2
    chance: 50.0
    sell-price: 0.4

stock:
  enabled: true
  max-stock: 1000
  restock-per-cycle: 8

spawner-price: 25000
