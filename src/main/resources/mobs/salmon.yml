# One product per file. The file name is the product id stored on placed spawners.
entity-type: SALMON
display-name: "&#D9604ASalmon"

head:
  material: PLAYER_HEAD
  head-texture: https://textures.minecraft.net/texture/791d9e69b795da4eaacfcf7350dfe8ae367fed833556706e040339dd7fe0240a
  lore:
    - "&aA spawner for salmon."

# Production delay in seconds, picked between min and max each cycle.
# Upgrade tiers multiply this speed; boosters speed it up further.
spawn-delays:
  min: 10
  max: 18
xp: 5

# Drops follow the vanilla loot table; chance is a percentage.
drops:
  1:
    material: SALMON
    amount:
      min: 1
      max: 1
    chance: 100.0
    sell-price: 0.6
  2:
    material: BONE_MEAL
    amount:
      min: 1
      max: 1
    chance: 5.0
    sell-price: 0.5

stock:
  enabled: true
  max-stock: 1000
  restock-per-cycle: 8

spawner-price: 1500
