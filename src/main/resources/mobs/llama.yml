# One product per file. The file name is the product id stored on placed spawners.
entity-type: LLAMA
display-name: "&#E8D9B0Llama"

head:
  material: PLAYER_HEAD
  head-texture: https://textures.minecraft.net/texture/107d02b825d4a476d78af6078541bdd0fcb682b0b4098b91a314e1b1c4e3c4e1
  lore:
    - "&aA spawner for llamas."

# Production delay in seconds, picked between min and max each cycle.
