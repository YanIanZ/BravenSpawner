# One product per file. The file name is the product id stored on placed spawners.
entity-type: TRADER_LLAMA
display-name: "&#3F6FB5Trader Llama"

head:
  material: PLAYER_HEAD
  head-texture: https://textures.minecraft.net/texture/e89a2eb17705fe7154ab041e5c76a08d41546a31ba20ea3060e3ec8edc10412c
  lore:
    - "&aA spawner for trader llamas."

# Production delay in seconds, picked between min and max each cycle.
# Upgrade tiers multiply this speed; boosters speed it up further.
spawn-delays:
  min: 24
  max: 38
xp: 5

# Drops follow the vanilla loot table; chance is a percentage.
drops:
  1:
    material: LEATHER
    amount:
      min: 1
      max: 2
    chance: 67.0
    sell-price: 0.5

stock:
  enabled: true
  max-stock: 1000
  restock-per-cycle: 8

spawner-price: 7500
