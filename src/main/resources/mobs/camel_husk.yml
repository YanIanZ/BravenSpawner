  min: 22
  max: 38
xp: 5

# Drops follow the vanilla loot table; chance is a percentage.
drops:
  1:
    material: ROTTEN_FLESH
    amount:
      min: 2
      max: 3
    chance: 100.0
    sell-price: 0.3

stock:
  enabled: true
  max-stock: 1000
  restock-per-cycle: 8

spawner-price: 15000
