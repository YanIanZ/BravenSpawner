# One product per file. The file name is the product id stored on placed spawners.
entity-type: PANDA
display-name: "&#F2F2F2Panda"

head:
  material: PLAYER_HEAD
  head-texture: https://textures.minecraft.net/texture/59df47e015d5c1c68d72be11bb656380fc6db533aab38941a91b1d3d5e396497
  lore:
    - "&aA spawner for pandas."

# Production delay in seconds, picked between min and max each cycle.
# Upgrade tiers multiply this speed; boosters speed it up further.
spawn-delays:
  min: 20
  max: 32
xp: 5

# Drops follow the vanilla loot table; chance is a percentage.
drops:
  1:
    material: BAMBOO
    amount:
      min: 1
      max: 1
    chance: 100.0
    sell-price: 0.2

stock:
  enabled: true
  max-stock: 1000
  restock-per-cycle: 8

spawner-price: 5000
