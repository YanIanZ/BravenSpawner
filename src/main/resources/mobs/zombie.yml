# One product per file. The file name is the product id stored on placed spawners.
entity-type: ZOMBIE
display-name: "&2Zombie"

head:
  material: PLAYER_HEAD
  head-texture: https://textures.minecraft.net/texture/81e504a787730b297d1004bb8796e29edc28496e4297c4b3f27343126cfd9acd
  lore:
    - "&aA spawner for zombies."

# Production delay in seconds, picked between min and max each cycle.
# Upgrade tiers multiply this speed; boosters speed it up further.
spawn-delays:
  min: 20
  max: 35
xp: 5

# chance is a percentage: 100.0 always drops, 0.5 is half a percent.
drops:
  1:
    material: ROTTEN_FLESH
    amount:
      min: 1
      max: 3
    chance: 80.0
  2:
    material: IRON_INGOT
    amount:
      min: 1
      max: 2
    chance: 10.0

# Item stock. max-stock is the reserve ceiling, restock-per-cycle is added
# every production cycle. Set enabled to false for unlimited output.
stock:
  enabled: true
  max-stock: 1000
  restock-per-cycle: 8

# Optional per-product item overrides; remove the '#' to use them.
# spawner-item-name: "&2%displayname% &7Spawner"
# spawner-item-lore:
#   - "&7A zombie in a box."

spawner-price: 15000
