# One product per file. The file name is the product id stored on placed spawners.
entity-type: WANDERING_TRADER
display-name: "&#4C78B5Wandering Trader"

head:
  material: PLAYER_HEAD
  head-texture: https://textures.minecraft.net/texture/5f1379a82290d7abe1efaabbc70710ff2ec02dd34ade386bc00c930c461cf932
  lore:
    - "&aA spawner for wandering traders."

interval-ticks: 1200
xp: 5

# Drops follow the vanilla loot table (empty loot table; trade goods instead).
drops:
  1:
    material: EMERALD
    amount:
      min: 1
      max: 1
    chance: 25.0
    sell-price: 3.0
  2:
    material: LEAD
    amount:
      min: 1
      max: 1
    chance: 30.0
    sell-price: 0.5
  3:
    material: MILK_BUCKET
    amount:
      min: 1
      max: 1
    chance: 8.5
    sell-price: 0.5

stock:
  enabled: true
  max-stock: 1000
  restock-per-cycle: 8

spawner-price: 25000
