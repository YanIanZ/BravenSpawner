# One product per file. The file name is the product id stored on placed spawners.
entity-type: VEX
display-name: "&#8FA3B8Vex"

head:
  material: PLAYER_HEAD
  head-texture: https://textures.minecraft.net/texture/e451fc4f3afe00ec0c073c7b308bca45df480eea1920eb3e1034133e6c6cc2d0
  lore:
    - "&aA spawner for vexes."

# Production delay in seconds, picked between min and max each cycle.
# Upgrade tiers multiply this speed; boosters speed it up further.
spawn-delays:
  min: 30
  max: 50
xp: 5

# Drops follow the vanilla loot table (empty loot table; the sword it carries).
drops:
  1:
    material: IRON_SWORD
    amount:
      min: 1
      max: 1
    chance: 8.5
    sell-price: 1.0

stock:
  enabled: true
  max-stock: 1000
  restock-per-cycle: 8

spawner-price: 15000
