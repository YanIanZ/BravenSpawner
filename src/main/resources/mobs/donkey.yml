# One product per file. The file name is the product id stored on placed spawners.
entity-type: DONKEY
display-name: "&#8B7660Donkey"

head:
  material: PLAYER_HEAD
  head-texture: https://textures.minecraft.net/texture/4e25ee9273ad579d44bf406f6f6295586481ea198fd572076cd0c5882da7e6cc
  lore:
    - "&aA spawner for donkeys."

# Production delay in seconds, picked between min and max each cycle.
# Upgrade tiers multiply this speed; boosters speed it up further.
spawn-delays:
  min: 22
  max: 36
xp: 5

# Drops follow the vanilla loot table; chance is a percentage.
drops:
  1:
    material: LEATHER
    amount:
      min: 1
      max: 2
    chance: 67.0
    sell-price: 0.5

stock:
  enabled: true
  max-stock: 1000
  restock-per-cycle: 8

spawner-price: 7500
