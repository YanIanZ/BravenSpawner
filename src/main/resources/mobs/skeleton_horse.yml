# One product per file. The file name is the product id stored on placed spawners.
entity-type: SKELETON_HORSE
display-name: "&#D8D8C8Skeleton Horse"

head:
  material: PLAYER_HEAD
  head-texture: https://textures.minecraft.net/texture/6e226705bd2a9e7bb8d6b0f4daa969b9e12d4ae5c66da693bb5f4a4a1e6aa296
  lore:
    - "&aA spawner for skeleton horses."

# Production delay in seconds, picked between min and max each cycle.
# Upgrade tiers multiply this speed; boosters speed it up further.
spawn-delays:
  min: 25
  max: 40
xp: 5

# Drops follow the vanilla loot table; chance is a percentage.
drops:
  1:
    material: BONE
    amount:
      min: 1
      max: 2
    chance: 67.0
    sell-price: 0.5

stock:
  enabled: true
  max-stock: 1000
  restock-per-cycle: 8

spawner-price: 15000
