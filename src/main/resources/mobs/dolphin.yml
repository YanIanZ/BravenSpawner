# One product per file. The file name is the product id stored on placed spawners.
entity-type: DOLPHIN
display-name: "&#7FA8C9Dolphin"

head:
  material: PLAYER_HEAD
  head-texture: https://textures.minecraft.net/texture/8e9688b950d880b55b7aa2cfcd76e5a0fa94aac6d16f78e833f7443ea29fed3
  lore:
    - "&aA spawner for dolphins."

# Production delay in seconds, picked between min and max each cycle.
# Upgrade tiers multiply this speed; boosters speed it up further.
spawn-delays:
  min: 24
  max: 40
xp: 5

# Drops follow the vanilla loot table; chance is a percentage.
drops:
  1:
    material: COD
    amount:
      min: 1
      max: 1
    chance: 50.0
    sell-price: 0.5

stock:
  enabled: true
  max-stock: 1000
  restock-per-cycle: 8

spawner-price: 5000
