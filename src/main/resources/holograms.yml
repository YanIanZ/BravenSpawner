# Per-spawner hologram text and refresh policy.
#
# Read once at enable, then again on /bspawner reload. Every line goes through
# PlatformText, so colour codes work here and PlaceholderAPI placeholders are
# resolved when config.yml has placeholders-in-gui: true.
#
# Tokens filled per spawner before rendering:
#   %product%   mob or item id from config.yml (mobs: / items:)
#   %kind%      "mob" or "item"
#   %stored%    items currently stored in the spawner
#   %slots%     distinct storage slots in use
#   %stack%     stacked spawner count
#   %tier%      tier name when the caller supplies one, else the tier index
#   %owner%     first eight characters of the owner UUID
#   %world% %x% %y% %z%   the block the hologram floats over
#
# An unknown token is left as written, so a typo is visible in-game instead of
# silently disappearing.

enabled: true

# How often every visible hologram is rewritten, in ticks. 40 = two seconds.
# Clamped to 1..72000 on load: 0 would rewrite the display every tick, and
# anything past an hour is indistinguishable from never.
update-interval-ticks: 40

# Players further than this many blocks from a spawner do not receive its
# hologram. Clamped to 1..128 on load; an unbounded value would track every
# spawner on the map for every player.
view-distance: 32

# Default template, used by every tier without an entry under tiers:.
lines:
  - "&e%product%"
  - "&7Stored: &f%stored%"
  - "&7Stack: &f%stack%"

# Per-tier overrides. Keys are tier names from config.yml upgrades.tiers.
# An entry may set lines, update-interval-ticks and view-distance; anything it
# omits falls back to the defaults above. Uncomment to use.
