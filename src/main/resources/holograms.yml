# ================================
#   VirtualSpawner Hologram Config
# ================================
# Notes:
# - This configuration file sets up the hologram display for Virtual Spawners.
# - Supported hologram types: decentholograms, fancyholograms, cmi
#
# Placeholders:
# %stack% - Number of stacked spawners
# %spawner_type_cap% - Capitalized spawner type (e.g., ZOMBIE, SKELETON)
# %storage_bar% - Visual representation of storage progress
# %xp_bar% - Visual representation of XP progress
# %color% - Dynamic color based on spawner type
#
# Color Codes:
# Use #RRGGBB format for custom colors (e.g., #FF0000 for red)
# ================================

# Enable or disable the hologram feature
enabled: false

# Hologram plugin to use (decentholograms, fancyholograms or cmi)
type: "decentholograms"

# Command configuration
commands:
  shtoggle:
    enabled: false  # Enables/disables the shtoggle command

# Hologram configuration
hologram:
  # Content of the hologram, supports placeholders and color codes
  content:
    - '#c2c2c2(#fff9c2%stack%#969696x#c2c2c2) %color%&l%spawner_type_cap% SPAWNER %corruption_status%'  # Displays stack count, spawner type, and corruption status
    - '#34eb98☁ sᴛoʀᴀɢᴇ #6e6d6d➤ %storage_bar%'  # Shows storage progress
    - '#fab170❆ xᴘ #6e6d6d➤ %xp_bar%'  # Shows XP progress

  # Progress bar settings
  bar-length: 12  # Total number of characters in the progress bar
  bar-char: ☰     # Character used to represent the progress bar
  bar-completed-color: '#00ff00'  # Color of the completed portion of the bar
  bar-not-completed-color: '#dedede'  # Color of the uncompleted portion of the bar

  # Distance in blocks at which the hologram becomes visible to players
  activation-radius: 10

  # Corruption
  corrupted-color: '#8A2BE2'  # Purple color for corrupted spawners
  corrupted-chars: '҉̸̢̡̛̖̗̘̙̜̝̞̟̠̣̤̥̦̩̪̫̬̭̮̯̰̱̲̳̹̺̻̼͇͈͉͍͎̀́̂̃̄̅̆̇̈̉̊̋̌̍̎̏̐̑̒̓̔̽̾̿̀́͂̓̈́͆͊͋͌̕̚ͅ' # Characters used for corruption effect
  corrupted-text: '&5&l[CORRUPTED]'  # Text to display when a spawner is corrupted
