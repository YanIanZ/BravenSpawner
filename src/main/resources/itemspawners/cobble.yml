# One product per file. The file name is the product id stored on placed spawners.
# item-type is the product ("what this spawner represents"); drops are what it yields.
item-type: COBBLESTONE
display-name: "&7Cobblestone Generator"

head:
  material: COBBLESTONE
  lore:
    - "&aA spawner for cobblestone."

interval-ticks: 1200
xp: 0

drops:
  1:
    material: COBBLESTONE
    amount:
      min: 1
      max: 3
    chance: 100.0

stock:
  enabled: true
  max-stock: 2000
  restock-per-cycle: 16

spawner-price: 5000
