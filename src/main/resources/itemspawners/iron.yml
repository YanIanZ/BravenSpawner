# One product per file. The file name is the product id stored on placed spawners.
item-type: IRON_INGOT
display-name: "&fIron Vein"

head:
  material: IRON_INGOT
  lore:
    - "&aA spawner for iron."

# Production delay in seconds, picked between min and max each cycle.
# Upgrade tiers multiply this speed; boosters speed it up further.
spawn-delays:
  min: 60
  max: 90
xp: 0

drops:
  1:
    material: IRON_INGOT
    amount:
      min: 1
      max: 2
    chance: 100.0

stock:
  enabled: true
  max-stock: 500
  restock-per-cycle: 4

spawner-price: 25000
