# One product per file. The file name is the product id stored on placed spawners.
item-type: DIAMOND
display-name: "&bDiamond Vein"

head:
  material: DIAMOND
  lore:
    - "&aA spawner for diamonds."

# Production delay in seconds, picked between min and max each cycle.
# Upgrade tiers multiply this speed; boosters speed it up further.
spawn-delays:
  min: 180
  max: 300
xp: 5

drops:
  1:
    material: DIAMOND
    amount:
      min: 1
      max: 1
    chance: 100.0

# A valuable product refills slowly and keeps a small reserve.
stock:
  enabled: true
  max-stock: 256
  restock-per-cycle: 2

spawner-price: 100000
