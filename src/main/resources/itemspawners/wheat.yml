# One product per file. The file name is the product id stored on placed spawners.
item-type: WHEAT
display-name: "&eWheat Farm"

head:
  material: WHEAT
  lore:
    - "&aA spawner for wheat."

# Production delay in seconds, picked between min and max each cycle.
# Upgrade tiers multiply this speed; boosters speed it up further.
spawn-delays:
  min: 15
  max: 25
xp: 0

drops:
  1:
    material: WHEAT
    amount:
      min: 1
      max: 3
    chance: 100.0
  2:
    material: WHEAT_SEEDS
    amount:
      min: 1
      max: 1
    chance: 50.0

stock:
  enabled: true
  max-stock: 1000
  restock-per-cycle: 8

spawner-price: 7500
